<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyLife — Offline</title>
<meta name="theme-color" content="#060914" />
<style>
  /* Deliberately self-contained (no external CSS/JS) so this page renders
     correctly even if nothing else has been cached yet — it IS the fallback
     of last resort for a fully offline navigation (see sw.js). */
  html, body { height: 100%; margin: 0; }
  body {
    background: #060914; color: #f5f7ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { color: #aab6d2; line-height: 1.5; margin: 0 0 20px; }
  button {
    appearance: none; border: 1px solid rgba(185,204,255,.25); background: rgba(14,21,42,.78);
    color: #f5f7ff; padding: 10px 20px; border-radius: 10px; font-size: 0.95rem; cursor: pointer;
  }
  button:hover { background: rgba(34,211,238,.15); }
  svg { color: #22d3ee; }
</style>
</head>
<body>
  <div class="card">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 3.5-2.3M19 12.5a10 10 0 0 0-2.8-2.1M12 20h.01M12.5 8.3A14 14 0 0 1 22.5 11"/>
    </svg>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Once you're back online, most of MyLife will keep working even with an unstable connection — your data syncs automatically through Firestore's offline support.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
