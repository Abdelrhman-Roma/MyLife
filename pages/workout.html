  <body data-page="workout">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-panel">
        <header class="topbar" id="topbar"></header>
        <section class="page-art" id="page-art"></section>
        <section class="stats-grid" id="stats-grid"></section>
        <section class="workout-sections" id="workout-root"></section>
        <datalist id="mylife-exercise-library">
          <!-- Chest -->
          <option value="Barbell Bench Press"></option>
          <option value="Incline Dumbbell Press"></option>
          <option value="Decline Bench Press"></option>
          <option value="Dumbbell Flyes"></option>
          <option value="Cable Crossover"></option>
          <option value="Push-Ups"></option>
          <option value="Chest Dips"></option>
          <!-- Back -->
          <option value="Deadlift"></option>
          <option value="Pull-Ups"></option>
          <option value="Lat Pulldown"></option>
          <option value="Barbell Row"></option>
          <option value="Seated Cable Row"></option>
          <option value="T-Bar Row"></option>
          <option value="Single-Arm Dumbbell Row"></option>
          <option value="Face Pulls"></option>
          <!-- Legs -->
          <option value="Back Squat"></option>
          <option value="Front Squat"></option>
          <option value="Romanian Deadlift"></option>
          <option value="Leg Press"></option>
          <option value="Walking Lunges"></option>
          <option value="Leg Extension"></option>
          <option value="Leg Curl"></option>
          <option value="Calf Raises"></option>
          <option value="Hip Thrust"></option>

          <option value="Arnold Press"></option>
          <option value="Lateral Raises"></option>
          <option value="Front Raises"></option>
          <option value="Rear Delt Flyes"></option>
          <option value="Upright Row"></option>
          <option value="Shrugs"></option>

          <option value="Barbell Curl"></option>
          <option value="Dumbbell Curl"></option>
          <option value="Hammer Curl"></option>
          <option value="Preacher Curl"></option>
          <option value="Tricep Pushdown"></option>
          <option value="Skull Crushers"></option>
          <option value="Overhead Tricep Extension"></option>
          <option value="Close-Grip Bench Press"></option>
          <!-- Core -->
          <option value="Plank"></option>
          <option value="Hanging Leg Raise"></option>
          <option value="Cable Crunch"></option>
          <option value="Russian Twists"></option>
          <option value="Ab Wheel Rollout"></option>
          <!-- Cardio / Conditioning -->
          <option value="Treadmill Run"></option>
          <option value="Rowing Machine"></option>
          <option value="Stationary Bike"></option>
          <option value="Jump Rope"></option>
          <option value="Kettlebell Swings"></option>
          <option value="Burpees"></option>
